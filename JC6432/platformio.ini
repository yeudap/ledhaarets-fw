; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DCONFIG_COMPILER_CXX_EXCEPTIONS=1
	-DARDUINO_ARCH_ESP32=1
	-D PROJECT_VER=\"7.03\"
	-D PRODUCT_MANUFACTURER=\"LEDHAARETS\"
	-D HARDWARE_VERSION=\"LH1022\"
	-D DEVICE_MODEL=\"JC6432\"
extra_scripts = post:stamp_app_desc.py
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
lib_deps = 
	adafruit/RTClib@^2.1.1
	adafruit/Adafruit BusIO@^1.14.0
	adafruit/Adafruit GFX Library@^1.11.3
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.0
	h2zero/NimBLE-Arduino@^2.5.1
	constiko/RTC RV-3028-C7 Arduino Library@^2.1.0
